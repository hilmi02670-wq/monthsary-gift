<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I love you sayang ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #fbc531 0%, #a55eea 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 30px 25px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 400px;
            width: 100%;
            z-index: 10;
            position: relative;
        }

        .profile-img {
            width: 100%;
            max-width: 180px;
            height: auto;
            border-radius: 20px;
            border: 4px solid white;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            object-fit: cover;
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Caveat', cursive;
            color: #4b33a8;
            font-size: 42px;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #747d8c;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .content-box {
            min-height: 130px;
            margin-bottom: 25px;
            font-size: 15px;
            line-height: 1.7;
            color: #2f3542;
            transition: opacity 0.3s ease;
        }

        .nav-tabs {
            display: flex;
            justify-content: space-around;
            background: rgba(255, 255, 255, 0.5);
            padding: 6px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            color: #747d8c;
            cursor: pointer;
            border-radius: 15px;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: #4b33a8;
            color: white;
            box-shadow: 0 4px 10px rgba(75, 51, 168, 0.3);
        }

        .audio-control {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            z-index: 20;
        }

        /* Overlay Pembuka Jaminan Musik Putar */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #a55eea, #4b33a8);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            transition: opacity 0.5s ease;
        }

        .open-btn {
            background: white;
            color: #4b33a8;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .open-btn:hover {
            transform: scale(1.05);
        }

        .floating-heart {
            position: absolute;
            pointer-events: none;
            animation: floatUp 4s linear forwards;
            opacity: 0.8;
            z-index: 1;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 0.8; }
            100% {
                transform: translateY(-10vh) scale(1.3) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Tombol Pembuka Biar Musik diizinkan Browser Berputar -->
    <div class="overlay" id="welcome-overlay">
        <h2 style="font-family: 'Caveat', cursive; font-size: 36px;">Ada pesan khusus buat kamu... ✨</h2>
        <button class="open-btn" onclick="bukaWebsite()">Klik untuk Buka 💜</button>
    </div>

    <!-- Audio Player: Saturn - SZA (Link Alternatif Stabil) -->
    <!-- Audio Player: File lokal dijamin 100% bunyi -->
<audio id="romantic-music" loop preload="auto">
    <source src="saturn.mp3" type="audio/mpeg">
</audio>

    <div class="container">
        <button class="audio-control" onclick="toggleAudio()" id="musicBtn">🎵</button>
        
        <img src="
        
        <h1>I love you sayang ❤️</h1>
        <div class="subtitle">Our Little Universe</div>

        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('letter', this)">Surat</button>
            <button class="tab-btn" onclick="switchTab('memories', this)">Memori</button>
            <button class="tab-btn" onclick="switchTab('wishes', this)">Pesan</button>
        </div>

        <div class="content-box" id="content-display">
            Klik tab di atas sambil dengerin lagunya ya. Tulisan ini sengaja aku bikin khusus buat kamu. Jangan ngambek lagi yaa, senyum dong? ✨
        </div>
    </div>

    <script>
        const music = document.getElementById("romantic-music");
        const musicBtn = document.getElementById("musicBtn");

        const dataContent = {
            letter: "Hai sayang! Aku cuma mau bilang kalau aku beruntung banget bisa memiliki kamu. Maaf ya kalau kadang aku bikin kesel, kurang peka, atau bikin kamu cemberut. *I love you today, tomorrow, and forever.* 💜",
            memories: "📍 **Belum ada**"
            wishes: "✨ **Pesan khusus buat kamu:**<br>Bonus QR ini: setelah di-scan, dilarang ngambek lagi ya! Yuk, ke depannya kita kurang-kurangin gengsinya, banyakin bahagianya, dan saling support terus. Sayang kamu banyak-banyak! 🌹"
        };

        // Fungsi pemicu utama saat tombol pembuka di-klik
        function bukaWebsite() {
            const overlay = document.getElementById("welcome-overlay");
            overlay.style.opacity = 0;
            setTimeout(() => {
                overlay.style.display = "none";
            }, 500);

            // Menjalankan audio (Aman dari block browser karena dipicu klik user)
            playMusic();
        }

        function playMusic() {
            music.play().then(() => {
                musicBtn.innerText = "⏸️";
                musicBtn.style.background = "#4b33a8";
                musicBtn.style.color = "white";
            }).catch(error => {
                console.log("Gagal memutar otomatis: ", error);
            });
        }

        function switchTab(key, element) {
            if (music.paused) {
                playMusic();
            }

            const display = document.getElementById("content-display");
            display.style.opacity = 0;
            setTimeout(() => {
                display.innerHTML = dataContent[key];
                display.style.opacity = 1;
            }, 150);

            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }

        function toggleAudio() {
            if (music.paused) {
                playMusic();
            } else {
                music.pause();
                musicBtn.innerText = "🎵";
                musicBtn.style.background = "rgba(255, 255, 255, 0.9)";
                musicBtn.style.color = "black";
            }
        }

        function createParticle() {
            const symbols = ['❤️', '✨', '🪐', '☁️'];
            const particle = document.createElement('div');
            particle.classList.add('floating-heart');
            
            particle.innerText = symbols[Math.floor(Math.random() * symbols.length)];
            particle.style.left = Math.random() * 100 + 'vw';
            particle.style.animationDuration = Math.random() * 3 + 4 + 's'; 
            particle.style.fontSize = Math.random() * 15 + 12 + 'px';
            
            document.body.appendChild(particle);

            setTimeout(() => {
                particle.remove();
            }, 6000);
        }

        setInterval(createParticle, 400);
    </script>
</body>
</html>
